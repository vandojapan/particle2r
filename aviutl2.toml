#:schema ./.aviutl2-cli/aviutl2.schema.json
# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。
[project]
id = "particle2r"
name = "particle2r"
version = "0.8.0-beta.2"

[development]
aviutl2_version = "2.1.9"

[artifacts.particle_basic]
destination = "Plugin/particle_basic.auf2"
placement_method = "copy"

[artifacts.particle_basic.profiles.debug]
build = "cargo build -p particle-aviutl2 --no-default-features --features stack-basic --target-dir target/stack-basic"
source = "target/stack-basic/debug/particle_aviutl2.dll"

[artifacts.particle_basic.profiles.release]
